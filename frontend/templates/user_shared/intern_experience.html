<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧實習平台 | 實習心得分享</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --primary: #0454a3;
      --primary-light: #3b82f6;
      --page-bg: #f4f7fb;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #dce3ef;
      --shadow: 0 18px 35px rgba(15, 23, 42, 0.08);
      --shadow-soft: 0 8px 20px rgba(15, 23, 42, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 15% 20%, rgba(91, 123, 255, 0.12), transparent 35%),
                  radial-gradient(circle at 85% 0%, rgba(4, 84, 163, 0.12), transparent 35%),
                  linear-gradient(180deg, #f9fbff 0%, #eef3fb 50%, #f6f7fb 100%);
      color: var(--text);
      min-height: 100vh;
      padding-top: 4.5rem;
    }

    header {
      background: var(--primary);
      color: #fff;
      padding: 1rem 2rem;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      box-shadow: 0 8px 20px rgba(0, 68, 148, 0.35);
    }

    .topbar {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .topbar h1 { font-size: 1.5rem; margin: 0; color: #fff; }

    .top-bar-left {
      position: absolute;
      left: 0;
      display: flex;
      align-items: center;
      height: 100%;
    }

    #menu-btn {
      width: 30px;
      height: 22px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: none;
      border: none;
      padding: 0;
    }

    #menu-btn span {
      display: block;
      width: 100%;
      height: 3px;
      background-color: white;
      border-radius: 2px;
    }

    #side-menu {
      position: fixed;
      top: 0; left: 0;
      height: 100vh;
      width: 320px;
      max-width: 80vw;
      background-color: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(6px);
      box-shadow: 3px 0 12px rgb(0 0 0 / 0.7);
      padding: 2rem 1.5rem;
      transform: translateX(-100%);
      transition: transform 0.3s ease-in-out;
      z-index: 1200;
      display: flex;
      flex-direction: column;
      color: white;
    }

    #side-menu.open { transform: translateX(0); }
    #side-menu h2 { margin: 0 0 1.5rem; font-size: 1.6rem; }

    #side-menu a {
      display: block;
      width: 100%;
      padding: 0.6rem 0;
      font-size: 1.05rem;
      color: #e2e8f0;
      text-decoration: none;
      border-radius: 4px;
    }

    #side-menu a:hover { background-color: rgba(255, 255, 255, 0.15); color: #fff; }

    #close-btn {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      font-size: 2rem;
      background: none;
      border: none;
      color: white;
      cursor: pointer;
    }

    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 20px 48px;
    }

    .page-intro {
      margin-bottom: 20px;
    }

    .page-intro h2 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    .page-intro h2 .bi {
      color: var(--primary);
      margin-right: 4px;
    }

    .page-intro p {
      font-size: 0.95rem;
      color: var(--muted);
    }

    .content-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .exp-tabs {
      display: flex;
      gap: 8px;
      padding: 16px 20px 0;
      background: linear-gradient(180deg, #fafbff 0%, #fff 100%);
      border-bottom: 1px solid var(--border);
    }

    .exp-tab {
      padding: 10px 20px;
      border: none;
      background: transparent;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
      border-radius: 10px 10px 0 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.2s, border-color 0.2s;
    }

    .exp-tab:hover { color: var(--primary); }
    .exp-tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary-light);
      background: #fff;
    }

    .tab-pane-body { padding: 20px 22px 28px; }

    .filter-bar {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .filter-bar .form-control,
    .filter-bar .form-select {
      border-radius: 10px;
      border-color: var(--border);
      font-size: 0.92rem;
    }

    .filter-bar .form-control:focus,
    .filter-bar .form-select:focus {
      border-color: #93c5fd;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .btn-search {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      border: none;
      color: #fff;
      border-radius: 10px;
      font-weight: 600;
      padding: 10px 16px;
      width: 100%;
    }

    .btn-search:hover { color: #fff; opacity: 0.92; }

    .btn-add-exp {
      background: linear-gradient(135deg, #16a34a 0%, #22c55e 100%);
      border: none;
      color: #fff;
      border-radius: 10px;
      font-weight: 600;
      padding: 10px 22px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-add-exp:hover { color: #fff; opacity: 0.92; }

    /* 主從式工作區 */
    .exp-workspace {
      display: grid;
      grid-template-columns: minmax(300px, 380px) 1fr;
      gap: 16px;
      min-height: 560px;
    }

    .panel-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.98rem;
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(180deg, #fafbff 0%, #fff 100%);
      flex-shrink: 0;
    }

    .panel-header i { color: var(--primary-light); }

    .list-count {
      margin-left: auto;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      background: #f1f5f9;
      padding: 3px 10px;
      border-radius: 999px;
    }

    .exp-list-panel { min-height: 0; }

    .exp-list-scroll {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
      max-height: 520px;
    }

    .exp-list-item {
      display: block;
      width: 100%;
      text-align: left;
      border: none;
      border-bottom: 1px solid #eef2f7;
      background: #fff;
      padding: 14px 16px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .exp-list-item:hover { background: #f8fafc; }

    .exp-list-item.active {
      background: linear-gradient(90deg, #eff6ff 0%, #f8fbff 100%);
      border-left: 3px solid var(--primary-light);
      padding-left: 13px;
    }

    .exp-list-item-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 4px;
    }

    .exp-list-item-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
      margin: 0;
    }

    .exp-list-item-sub {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .exp-list-item-preview {
      font-size: 0.82rem;
      color: #64748b;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .exp-list-item-foot {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-size: 0.76rem;
      color: var(--muted);
    }

    .exp-list-item-foot .exp-rating { color: #f59e0b; font-weight: 600; }

    .exp-list-empty {
      padding: 40px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .exp-list-empty i {
      font-size: 2rem;
      color: #cbd5e1;
      display: block;
      margin-bottom: 10px;
    }

    .exp-pager {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px 12px 14px;
      border-top: 1px solid var(--border);
      background: #fafbff;
      flex-shrink: 0;
    }

    .exp-pager-btn {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--primary);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s;
    }

    .exp-pager-btn:hover:not(:disabled) {
      background: #eff6ff;
      border-color: #93c5fd;
    }

    .exp-pager-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .exp-pager-info {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--muted);
      min-width: 72px;
      text-align: center;
    }

    .exp-detail-panel { min-height: 560px; }

    .detail-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      color: var(--muted);
      text-align: center;
      gap: 10px;
    }

    .detail-empty i { font-size: 3rem; color: #cbd5e1; }

    .detail-empty h3 {
      font-size: 1.1rem;
      color: #475569;
      font-weight: 600;
      margin: 0;
    }

    .detail-empty p { font-size: 0.9rem; margin: 0; }

    .detail-content {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    .detail-content.show { display: flex; }

    .detail-head {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #fafbff 0%, #fff 100%);
      flex-shrink: 0;
    }

    .detail-head-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }

    .detail-head h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
      margin: 0;
      line-height: 1.35;
    }

    .detail-job {
      font-size: 0.92rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .detail-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .meta-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.82rem;
      color: #475569;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      padding: 5px 12px;
    }

    .meta-chip i { color: var(--primary-light); }

    .detail-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px 22px 24px;
    }

    .detail-rating-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 0.95rem;
    }

    .detail-rating-row .stars { color: #f59e0b; letter-spacing: 1px; }

    .detail-content-text {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      line-height: 1.8;
      color: #334155;
      white-space: pre-wrap;
      font-size: 0.95rem;
    }

    .detail-time {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 16px;
      margin-bottom: 0;
    }

    .btn-del-exp {
      border-radius: 10px;
      font-size: 0.85rem;
      padding: 6px 14px;
      flex-shrink: 0;
    }

    .status-badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    .status-badge.approved { background: #dcfce7; color: #15803d; }
    .status-badge.pending { background: #fef3c7; color: #b45309; }
    .status-badge.rejected { background: #fee2e2; color: #b91c1c; }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
    }

    .empty-state i {
      font-size: 2.5rem;
      color: #cbd5e1;
      display: block;
      margin-bottom: 12px;
    }

    .withdrawn-notice {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 1rem 1.25rem;
      background: linear-gradient(135deg, #fef3c7 0%, #fffbeb 100%);
      border: 1px solid #fcd34d;
      border-radius: 12px;
      color: #92400e;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    .modal-content {
      border-radius: 16px;
      border: none;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .modal-header {
      border-bottom: 1px solid var(--border);
      padding: 18px 22px;
    }

    .modal-header.add-header {
      background: linear-gradient(135deg, #16a34a 0%, #22c55e 100%);
      color: #fff;
      border-bottom: none;
    }

    .modal-header.add-header .btn-close {
      filter: brightness(0) invert(1);
    }

    .modal-title { font-weight: 700; }

    .modal-body { padding: 22px; }

    .form-control, .form-select {
      border-radius: 10px;
      border-color: var(--border);
    }

    .form-control:focus, .form-select:focus {
      border-color: #93c5fd;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .readonly-field { background: #f8fafc !important; color: #64748b; }

    @media (max-width: 992px) {
      .exp-workspace {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .exp-list-scroll { max-height: 300px; }
      .exp-detail-panel { min-height: 400px; }
    }

    @media (max-width: 768px) {
      .exp-tabs { flex-wrap: wrap; }
    }
  </style>
</head>

<body data-user-id="{{ user_id or 0 }}" data-initial-company-id="{{ initial_company_id or '' }}">
  <header>
    <div class="topbar">
      <div class="top-bar-left">
        <button id="menu-btn" type="button" aria-label="開啟選單">
          <span></span><span></span><span></span>
        </button>
      </div>
      <h1>實習心得分享</h1>
    </div>
  </header>

  <nav id="side-menu" aria-hidden="true" role="navigation" aria-label="功能選單">
    <button id="close-btn" type="button" aria-label="關閉功能選單">×</button>
    <h2>功能選單</h2>
    <a href="/student_home">首頁</a>
    <a href="/profile">個人資料</a>
    <a href="/resume_folders">履歷管理</a>
    <a href="/fill_preferences">填寫志願序</a>
    <a href="/look_company">投遞履歷</a>
    <a href="/notifications">通知</a>
    <a href="/interview_schedule">行事曆</a>
    <a href="/intern_achievement">學生媒合結果</a>
    <a href="/intern_weekly">實習週記</a>
    <a href="/intern_experience">實習心得</a>
    <a href="/logout">登出</a>
  </nav>

  <main>
    <section class="page-intro">
      <h2><i class="bi bi-chat-square-heart"></i> 實習心得交流</h2>
      <p>瀏覽學長姐的實習經驗，或分享你的實習故事</p>
    </section>

    <section class="content-card">
      <div class="exp-tabs" role="tablist">
        <button class="exp-tab active" id="all-tab" data-bs-toggle="tab" data-bs-target="#all-experiences"
          type="button" role="tab" aria-controls="all-experiences" aria-selected="true">
          <i class="bi bi-grid"></i> 所有心得
        </button>
        <button class="exp-tab" id="my-tab" data-bs-toggle="tab" data-bs-target="#my-experiences"
          type="button" role="tab" aria-controls="my-experiences" aria-selected="false">
          <i class="bi bi-person-lines-fill"></i> 我的心得
        </button>
      </div>

      <div class="tab-content" id="experienceTabContent">
        <div class="tab-pane fade show active" id="all-experiences" role="tabpanel" aria-labelledby="all-tab">
          <div class="tab-pane-body">
            <div class="filter-bar">
              <div class="row g-3 align-items-end">
                <div class="col-md-4">
                  <label class="form-label small text-muted mb-1"><i class="bi bi-search"></i> 關鍵字</label>
                  <input id="searchKeyword" class="form-control" placeholder="搜尋公司名稱…">
                </div>
                <div class="col-md-3">
                  <label class="form-label small text-muted mb-1"><i class="bi bi-building"></i> 公司</label>
                  <select id="filterCompany" class="form-select">
                    <option value="">選擇公司</option>
                  </select>
                </div>
                <div class="col-md-2">
                  <label class="form-label small text-muted mb-1"><i class="bi bi-calendar3"></i> 學年</label>
                  <select id="filterYear" class="form-select">
                    <option value="">選擇學年</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <button id="btnSearch" class="btn btn-search w-100"><i class="bi bi-search"></i> 搜尋</button>
                </div>
              </div>
            </div>
            <div class="exp-workspace">
              <aside class="panel-card exp-list-panel">
                <div class="panel-header">
                  <i class="bi bi-list-ul"></i> 心得列表
                  <span class="list-count" id="allListCount"></span>
                </div>
                <div class="exp-list-scroll" id="experienceList"></div>
                <div class="exp-pager" id="allExperiencesPagination" style="display:none;" aria-label="所有心得分頁"></div>
              </aside>
              <section class="panel-card exp-detail-panel">
                <div class="detail-empty" id="allDetailEmpty">
                  <i class="bi bi-journal-text"></i>
                  <h3>請從列表選擇心得</h3>
                  <p>點選列表項目後，即可在此閱讀完整內容</p>
                </div>
                <div class="detail-content" id="allDetailContent">
                  <div class="detail-head">
                    <div class="detail-head-top">
                      <div>
                        <h2 id="allDetailCompany">—</h2>
                        <div class="detail-job" id="allDetailJob">—</div>
                      </div>
                    </div>
                    <div class="detail-meta">
                      <span class="meta-chip"><i class="bi bi-person"></i> <span id="allDetailAuthor">—</span></span>
                      <span class="meta-chip"><i class="bi bi-calendar3"></i> 學年 <span id="allDetailYear">—</span></span>
                      <span class="meta-chip"><i class="bi bi-cash-stack"></i> <span id="allDetailSalary">—</span></span>
                    </div>
                  </div>
                  <div class="detail-body">
                    <div class="detail-rating-row" id="allDetailRating"></div>
                    <div class="detail-content-text" id="allDetailText"></div>
                    <p class="detail-time"><i class="bi bi-clock"></i> 發表時間：<span id="allDetailCreated"></span></p>
                  </div>
                </div>
              </section>
            </div>
          </div>
        </div>

        <div class="tab-pane fade" id="my-experiences" role="tabpanel" aria-labelledby="my-tab">
          <div class="tab-pane-body">
            <div class="d-flex justify-content-end mb-3">
              <button id="btnAddExperience" class="btn btn-add-exp" data-bs-toggle="modal" data-bs-target="#addModal">
                <i class="bi bi-plus-lg"></i> 上傳心得
              </button>
            </div>
            <div id="withdrawnNotice" class="withdrawn-notice" style="display:none;">
              <i class="bi bi-exclamation-triangle-fill"></i>
              <span>您已退實習，無法新增心得，但仍可瀏覽「所有心得」。</span>
            </div>
            <div class="exp-workspace">
              <aside class="panel-card exp-list-panel">
                <div class="panel-header">
                  <i class="bi bi-list-ul"></i> 我的心得
                  <span class="list-count" id="myListCount"></span>
                </div>
                <div class="exp-list-scroll" id="myExperienceList"></div>
                <div class="exp-pager" id="myExperiencesPagination" style="display:none;" aria-label="我的心得分頁"></div>
              </aside>
              <section class="panel-card exp-detail-panel">
                <div class="detail-empty" id="myDetailEmpty">
                  <i class="bi bi-journal-plus"></i>
                  <h3>請從列表選擇心得</h3>
                  <p>點選列表項目後，即可在此檢視或管理您的心得</p>
                </div>
                <div class="detail-content" id="myDetailContent">
                  <div class="detail-head">
                    <div class="detail-head-top">
                      <div>
                        <h2 id="myDetailCompany">—</h2>
                        <div class="detail-job" id="myDetailJob">—</div>
                      </div>
                      <div class="d-flex align-items-center gap-2">
                        <span id="myDetailStatus"></span>

  <div class="modal fade" id="addModal" tabindex="-1">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // 從 body data 屬性注入目前登入者與指定公司 (若有)
    const USER_ID = Number(document.body.dataset.userId || 0);
    const INITIAL_COMPANY_ID = document.body.dataset.initialCompanyId || '';
    let selectedCompanyId = INITIAL_COMPANY_ID || '';
    let hasPrefilledFormCompany = false;
    let hasPrefilledFilterCompany = false;
    
    // 儲存學生的錄取資訊
    let studentAdmissionInfo = null;
    // 是否已退實習（退實習後不可新增心得，既有心得唯讀）
    let isWithdrawn = false;
    
    // 分頁與選取狀態
    let allExperiencesPage = 1;
    let myExperiencesPage = 1;
    const perPage = 10;
    let allExperiencesCache = [];
    let myExperiencesCache = [];
    let selectedAllExpId = null;
    let selectedMyExpId = null;

    const TAB_CONFIG = {
      all: {
        listId: 'experienceList',
        countId: 'allListCount',
        pagerId: 'allExperiencesPagination',
        emptyId: 'allDetailEmpty',
        contentId: 'allDetailContent',
        showDelete: false,
        showStatus: false
      },
      my: {
        listId: 'myExperienceList',
        countId: 'myListCount',
        pagerId: 'myExperiencesPagination',
        emptyId: 'myDetailEmpty',
        contentId: 'myDetailContent',
        showDelete: true,
        showStatus: true
      }
    };

    // 產生民國年下拉 (近 6 年)
    async function populateYearSelect(selectId) {
      const sel = document.getElementById(selectId);
      try {
        const res = await fetch('/semester/api/current');
        const data = await res.json();
        if (data.success && data.semester && data.semester.code) {
          const currentYear = parseInt(data.semester.code.substring(0, 3));
          for (let y = currentYear; y >= currentYear - 5; y--) {
            const opt = document.createElement('option');
            opt.value = y;
            opt.textContent = y;
            sel.appendChild(opt);
          }
        }
      } catch (e) {
        const fallback = new Date().getFullYear() - 1911;
        for (let y = fallback; y >= fallback - 5; y--) {
          const opt = document.createElement('option');
          opt.value = y;
          opt.textContent = y;
          sel.appendChild(opt);
        }
      }
    }

    populateYearSelect('filterYear');

    // 載入學生的錄取資訊
    async function loadStudentAdmission() {
      try {
        const res = await fetch('/admission/api/get_my_admission');
        if (!res.ok) throw new Error('資料讀取失敗');
        const data = await res.json();
        if (!data.success) throw new Error(data.message || '查詢失敗');
        
        isWithdrawn = data.is_withdrawn === true;
        studentAdmissionInfo = {
          admission: data.admission,
          final_preference: data.final_preference,
          is_withdrawn: isWithdrawn
        };
        
        return studentAdmissionInfo;
      } catch (error) {
        console.error('載入學生錄取資訊失敗:', error);
        return null;
      }
    }
    
    // 將西元年轉換為民國年
    function toMinguoYear(westernYear) {
      if (!westernYear) return null;
      const year = parseInt(westernYear);
      if (isNaN(year)) return null;
      return year - 1911;
    }
    
    // 從日期字串中提取年份
    function extractYearFromDate(dateString) {
      if (!dateString) return null;
      // 處理 YYYY-MM-DD 格式
      if (typeof dateString === 'string' && dateString.includes('-')) {
        const parts = dateString.split('-');
        if (parts.length >= 1) {
          return parseInt(parts[0], 10);
        }
      }
      // 嘗試解析為 Date 對象
      try {
        const date = new Date(dateString);
        if (!isNaN(date.getTime())) {
          return date.getFullYear();
        }
      } catch (e) {
        // 忽略錯誤
      }
      return null;
    }

    // 載入公司下拉 - 從後端 API 抓取資料表公司資料（僅用於篩選器）
    async function loadCompanies() {
      try {
        const companyFilter = document.getElementById('filterCompany');
        
        // 顯示載入中狀態
        companyFilter.innerHTML = '<option value="">載入公司中...</option>';
        
        const res = await fetch('/intern_experience/api/companies');
        const data = await res.json();
        
        // 重置選單
        companyFilter.innerHTML = '<option value="">選擇公司</option>';
        
        if (data.success && data.data && Array.isArray(data.data)) {
          // 從資料表抓取到的公司資料，逐一加入下拉選單（僅用於篩選器）
          if (data.data.length > 0) {
            data.data.forEach(c => {
              if (c.id && c.company_name) {
                companyFilter.innerHTML += `<option value="${c.id}">${c.company_name}</option>`;
              }
            });
            
            if (!hasPrefilledFilterCompany && selectedCompanyId) {
              companyFilter.value = selectedCompanyId;
              hasPrefilledFilterCompany = true;
            }
          } else {
            companyFilter.innerHTML = '<option value="">目前無可用公司</option>';
          }
        } else {
          // API 回傳失敗或資料格式錯誤
          const errorMsg = data.message || '載入公司資料失敗';
          companyFilter.innerHTML = `<option value="">${errorMsg}</option>`;
          console.error('載入公司資料失敗:', data);
        }
      } catch (error) {
        console.error('抓取公司資料時發生錯誤:', error);
        const companyFilter = document.getElementById('filterCompany');
        companyFilter.innerHTML = '<option value="">載入失敗，請重新整理頁面</option>';
      }
    }
    
    // 限制公司選擇並自動填入表單
    async function setupAddFormWithAdmission() {
      try {
        // 載入學生的錄取資訊
        const admissionInfo = await loadStudentAdmission();
        
        if (!admissionInfo || !admissionInfo.admission) {
          // 如果沒有錄取資訊，顯示提示
          document.getElementById('company_name_display').value = admissionInfo && admissionInfo.is_withdrawn ? '您已退實習，無法新增心得' : '您尚未有錄取紀錄，無法新增心得';
          document.getElementById('company_id').value = '';
          document.getElementById('job_title_display').value = '';
          document.getElementById('job_id').value = '';
          document.getElementById('year').value = '';
          return;
        }
        if (admissionInfo.is_withdrawn) {
          document.getElementById('company_name_display').value = '您已退實習，無法新增心得';
          document.getElementById('company_id').value = '';
          document.getElementById('job_title_display').value = '';
          document.getElementById('job_id').value = '';
          document.getElementById('year').value = '';
          return;
        }
        
        const { admission, final_preference } = admissionInfo;
        const companyId = admission.company_id;
        const companyName = admission.company_name || '';
        const jobId = final_preference ? final_preference.job_id : null;
        const jobTitle = final_preference ? final_preference.job_title : '';
        
        // 設定公司資訊（唯讀顯示）
        if (companyId && companyName) {
          document.getElementById('company_name_display').value = companyName;
          document.getElementById('company_id').value = companyId;
        }
        
        // 設定職缺資訊（唯讀顯示）
        if (jobId && jobTitle) {
          document.getElementById('job_title_display').value = jobTitle;
          document.getElementById('job_id').value = jobId;
        } else {
          document.getElementById('job_title_display').value = '無職缺資訊';
          document.getElementById('job_id').value = '';
        }
        
        // 自動填入學年（從 semesters 取得）
        const yearInput = document.getElementById('year');
        try {
          const semRes = await fetch('/semester/api/current');
          const semData = await semRes.json();
          if (semData.success && semData.semester && semData.semester.code) {
            yearInput.value = semData.semester.code.substring(0, 3);
          } else {
            yearInput.value = '';
          }
        } catch (e) {
          yearInput.value = '';
        }
        
      } catch (error) {
        console.error('設定表單時發生錯誤:', error);
      }
    }

    // 載入職缺的函數（已不再需要，因為職缺資訊直接從錄取資訊中獲取）
    // 此函數保留以備不時之需，但現在不會被調用

    function escapeHtml(text) {
      return String(text || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function getExperienceStatus(item) {
      const isPublic = item.is_public === 1 || item.is_public === '1' || item.is_public === true;
      const isRejected = (item.status && item.status.toLowerCase() === 'rejected') ||
        item.is_rejected === true || item.is_rejected === 1 || item.is_rejected === '1' ||
        item.is_public === 2 || item.is_public === '2';
      if (isRejected) return { key: 'rejected', label: '已退件', className: 'rejected' };
      if (isPublic) return { key: 'approved', label: '已通過', className: 'approved' };
      return { key: 'pending', label: '待審核', className: 'pending' };
    }

    function getRatingStars(rating) {
      if (!rating && rating !== 0) return { stars: '—', value: '—' };
      const num = parseInt(rating, 10) || 0;
      return { stars: '★'.repeat(Math.min(5, num)), value: rating };
    }

    function getStatusBadgeHtml(item, showStatus) {
      if (!showStatus) return '';
      const status = getExperienceStatus(item);
      return `<span class="status-badge ${status.className}">${status.label}</span>`;
    }

    function buildListItem(item, tab, selectedId) {
      const company = escapeHtml(item.company_name || '未填寫公司');
      const job = item.job_title ? escapeHtml(item.job_title) : '';
      const yearText = item.year ? `${item.year}` : '—';
      const { stars, value: rating } = getRatingStars(item.rating);
      const preview = escapeHtml((item.content || '').replace(/\s+/g, ' ').trim());
      const cfg = TAB_CONFIG[tab];
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = `exp-list-item${String(selectedId) === String(item.id) ? ' active' : ''}`;
      btn.dataset.id = item.id;
      btn.innerHTML = `
        <div class="exp-list-item-head">
          <h6 class="exp-list-item-title">${company}</h6>
          ${getStatusBadgeHtml(item, cfg.showStatus)}
        </div>
        ${job ? `<div class="exp-list-item-sub">${job}</div>` : ''}
        <div class="exp-list-item-preview">${preview || '（無內容）'}</div>
        <div class="exp-list-item-foot">
          <span><i class="bi bi-calendar3"></i> ${yearText}</span>
          <span class="exp-rating"><i class="bi bi-star-fill"></i> ${stars} (${rating})</span>
        </div>`;
      btn.addEventListener('click', () => selectExperience(item.id, tab));
      return btn;
    }

    function renderListEmpty(container, message, icon) {
      container.innerHTML = `
        <div class="exp-list-empty">
          <i class="bi bi-${icon}"></i>
          <p>${escapeHtml(message)}</p>
        </div>`;
    }

    function renderExperienceList(items, tab, selectedId) {
      const cfg = TAB_CONFIG[tab];
      const container = document.getElementById(cfg.listId);
      const countEl = document.getElementById(cfg.countId);
      if (!container) return;

      container.innerHTML = '';
      if (countEl) countEl.textContent = items.length ? `${items.length} 筆` : '';

      if (!items.length) {
        renderListEmpty(container, tab === 'my' ? '尚無心得' : '找不到符合條件的心得', tab === 'my' ? 'journal-plus' : 'inbox');
        clearDetailPanel(tab);
        return;
      }

      items.forEach(item => container.appendChild(buildListItem(item, tab, selectedId)));
    }

    function renderCompactPagination(containerId, currentPage, totalPages, onPageChange) {
      const container = document.getElementById(containerId);
      if (!container) return;

      if (totalPages <= 1) {
        container.style.display = 'none';
        container.innerHTML = '';
        return;
      }

      container.style.display = 'flex';
      container.innerHTML = `
        <button type="button" class="exp-pager-btn" data-action="prev" aria-label="上一頁" ${currentPage <= 1 ? 'disabled' : ''}>
          <i class="bi bi-chevron-left"></i>
        </button>
        <span class="exp-pager-info">${currentPage} / ${totalPages}</span>
        <button type="button" class="exp-pager-btn" data-action="next" aria-label="下一頁" ${currentPage >= totalPages ? 'disabled' : ''}>
          <i class="bi bi-chevron-right"></i>
        </button>`;

      container.querySelector('[data-action="prev"]')?.addEventListener('click', () => {
        if (currentPage > 1) onPageChange(currentPage - 1);
      });
      container.querySelector('[data-action="next"]')?.addEventListener('click', () => {
        if (currentPage < totalPages) onPageChange(currentPage + 1);
      });
    }

    function clearDetailPanel(tab) {
      const cfg = TAB_CONFIG[tab];
      document.getElementById(cfg.emptyId).style.display = '';
      document.getElementById(cfg.contentId).classList.remove('show');
      if (tab === 'all') selectedAllExpId = null;
      if (tab === 'my') selectedMyExpId = null;
    }

    function renderDetailPanel(item, tab) {
      const cfg = TAB_CONFIG[tab];
      const prefix = tab;
      document.getElementById(cfg.emptyId).style.display = 'none';
      document.getElementById(cfg.contentId).classList.add('show');

      const company = item.company_name || '未填寫公司';
      const job = item.job_title || '—';
      const year = item.year || '—';
      const salary = item.job_salary || '—';
      const { stars, value: rating } = getRatingStars(item.rating);

      document.getElementById(`${prefix}DetailCompany`).textContent = company;
      document.getElementById(`${prefix}DetailJob`).textContent = job;
      document.getElementById(`${prefix}DetailYear`).textContent = year;
      document.getElementById(`${prefix}DetailSalary`).textContent = salary;
      document.getElementById(`${prefix}DetailText`).textContent = item.content || '';
      document.getElementById(`${prefix}DetailCreated`).textContent = formatDateTime(item.created_at) || '—';
      document.getElementById(`${prefix}DetailRating`).innerHTML =
        `<span class="stars">${stars}</span><span>${rating} / 5</span>`;

      if (tab === 'all') {
        document.getElementById('allDetailAuthor').textContent = item.author || '—';
      }

      if (tab === 'my') {
        const statusEl = document.getElementById('myDetailStatus');
        const deleteBtn = document.getElementById('myDetailDeleteBtn');
        statusEl.innerHTML = getStatusBadgeHtml(item, true);
        const canDelete = cfg.showDelete && !isWithdrawn;
        if (deleteBtn) {
          deleteBtn.style.display = canDelete ? '' : 'none';
          deleteBtn.onclick = () => deleteExp(item.id);
        }
      }

      if (window.matchMedia('(max-width: 992px)').matches) {
        document.getElementById(cfg.contentId)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function selectExperience(id, tab) {
      const cache = tab === 'all' ? allExperiencesCache : myExperiencesCache;
      const item = cache.find(row => String(row.id) === String(id));
      if (!item) return;

      if (tab === 'all') selectedAllExpId = id;
      else selectedMyExpId = id;

      renderExperienceList(cache, tab, id);
      renderDetailPanel(item, tab);
    }

    function syncSelectionAfterLoad(tab, items) {
      const selectedId = tab === 'all' ? selectedAllExpId : selectedMyExpId;
      const stillExists = selectedId && items.some(row => String(row.id) === String(selectedId));
      if (stillExists) {
        selectExperience(selectedId, tab);
      } else if (items.length) {
        selectExperience(items[0].id, tab);
      } else {
        clearDetailPanel(tab);
      }
    }

    // 載入心得列表（所有心得）；退實習生仍可查看其他人的心得，不因 isWithdrawn 而阻擋
    async function loadExperiences(page = null) {
      try {
        if (page !== null) {
          allExperiencesPage = page;
        }
        
        const keyword = document.getElementById('searchKeyword').value;
        const year = document.getElementById('filterYear').value;
        const params = new URLSearchParams({
          keyword,
          year,
          company_id: selectedCompanyId || '',
          my_experiences: 'false',
          page: allExperiencesPage,
          per_page: perPage
        });
        
        console.log('[載入心得] 請求參數:', params.toString());
        const res = await fetch(`/intern_experience/api/list?${params.toString()}`);
        
        if (!res.ok) {
          throw new Error(`HTTP 錯誤: ${res.status} ${res.statusText}`);
        }
        
        const data = await res.json();
        console.log('[載入心得] API 回應:', data);
        
        if (data.success && data.data && data.data.length > 0) {
          allExperiencesCache = data.data;
          syncSelectionAfterLoad('all', allExperiencesCache);

          if (data.total_pages && data.total_pages > 0) {
            renderCompactPagination('allExperiencesPagination', data.page, data.total_pages, (page) => {
              allExperiencesPage = page;
              loadExperiences(page);
            });
          } else {
            document.getElementById('allExperiencesPagination').style.display = 'none';
          }
        } else {
          allExperiencesCache = [];
          renderExperienceList([], 'all', null);
          clearDetailPanel('all');
          document.getElementById('allExperiencesPagination').style.display = 'none';
        }
      } catch (error) {
        console.error('[載入心得] 發生錯誤:', error);
        allExperiencesCache = [];
        const list = document.getElementById('experienceList');
        renderListEmpty(list, `載入失敗：${error.message}`, 'exclamation-circle');
        clearDetailPanel('all');
        document.getElementById('allExperiencesPagination').style.display = 'none';
      }
    }

    // 載入自己的心得列表
    async function loadMyExperiences(page = null) {
      try {
        if (page !== null) {
          myExperiencesPage = page;
        }
        
        const params = new URLSearchParams({
          my_experiences: 'true',
          page: myExperiencesPage,
          per_page: perPage
        });
        
        console.log('[載入我的心得] 請求參數:', params.toString());
        const res = await fetch(`/intern_experience/api/list?${params.toString()}`);
        
        if (!res.ok) {
          throw new Error(`HTTP 錯誤: ${res.status} ${res.statusText}`);
        }
        
        const data = await res.json();
        console.log('[載入我的心得] API 回應:', data);
        
        if (data.success && data.data && data.data.length > 0) {
          myExperiencesCache = data.data;
          syncSelectionAfterLoad('my', myExperiencesCache);

          if (data.total_pages && data.total_pages > 0) {
            renderCompactPagination('myExperiencesPagination', data.page, data.total_pages, (page) => {
              myExperiencesPage = page;
              loadMyExperiences(page);
            });
          } else {
            document.getElementById('myExperiencesPagination').style.display = 'none';
          }
        } else {
          myExperiencesCache = [];
          const list = document.getElementById('myExperienceList');
          const emptyMsg = isWithdrawn
            ? '尚無心得紀錄'
            : '您還沒有上傳任何心得，點右上角「上傳心得」開始分享';
          renderListEmpty(list, emptyMsg, 'journal-plus');
          document.getElementById('myListCount').textContent = '';
          clearDetailPanel('my');
          document.getElementById('myExperiencesPagination').style.display = 'none';
        }
      } catch (error) {
        console.error('[載入我的心得] 發生錯誤:', error);
        myExperiencesCache = [];
        const list = document.getElementById('myExperienceList');
        renderListEmpty(list, `載入失敗：${error.message}`, 'exclamation-circle');
        clearDetailPanel('my');
        document.getElementById('myExperiencesPagination').style.display = 'none';
      }
    }

    // 格式化日期時間為 "YYYY-MM-DD HH:MM" 格式
    function formatDateTime(dateTimeString) {
      if (!dateTimeString) return '';

      // 若是 MySQL DATETIME 格式（YYYY-MM-DD HH:MM:SS），直接截取，避免瀏覽器時區轉換
      const mysqlPattern = /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}(:\d{2})?$/;
      if (mysqlPattern.test(dateTimeString)) {
        return dateTimeString.slice(0, 16); // 取到分鐘
      }

      // 其他格式交由 Date 解析，再輸出同樣樣式
      try {
        const date = new Date(dateTimeString);
        if (isNaN(date.getTime())) return dateTimeString;

        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');

        return `${year}-${month}-${day} ${hours}:${minutes}`;
      } catch (error) {
        return dateTimeString;
      }
    }

    // 刪除心得（詳情面板）
    async function deleteExp(id) {
      const confirmed = await showConfirmModal(
        '刪除心得',
        '確定要刪除此心得？',
        '#dc2626',
        '#dc2626'
      );
      if (!confirmed) return;

      const res = await fetch(`/intern_experience/api/delete/${id}`, { method: 'DELETE' });
      const data = await res.json();
      if (data.success) {
        await showResultModal('刪除心得', '心得已刪除。');
        selectedMyExpId = null;
        loadExperiences();
        loadMyExperiences();
      } else {
        await showResultModal('刪除心得', '刪除失敗：' + data.message);
      }
    }

    function showConfirmModal(title, message, okColor = '#1d4ed8', okBorderColor = '#1d4ed8') {
      return new Promise((resolve) => {
        let modalEl = document.getElementById('confirmModal');
        if (!modalEl) {
          modalEl = document.createElement('div');
          modalEl.innerHTML = `
            <div class="modal fade" id="confirmModal" tabindex="-1">
              <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content" style="border-radius: 18px; border:none; padding:20px 24px;">
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"
                    style="position:absolute; top:18px; right:18px;"></button>
                  <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title" id="confirmModalTitle"></h5>
                  </div>
                  <div class="modal-body pt-2">
                    <p id="confirmModalMessage"></p>
                  </div>
                  <div class="modal-footer border-0 d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="confirmModalOkBtn">確定</button>
                  </div>
                </div>
              </div>
            </div>`;
          document.body.appendChild(modalEl);
        }

        document.getElementById('confirmModalTitle').textContent = title;
        document.getElementById('confirmModalMessage').textContent = message;
        const okBtn = document.getElementById('confirmModalOkBtn');
        okBtn.style.background = okColor;
        okBtn.style.borderColor = okBorderColor;

        const modal = new bootstrap.Modal(document.getElementById('confirmModal'));
        modal.show();

        const cancelBtn = document.querySelector('#confirmModal .btn-secondary');

        const cleanup = () => {
          okBtn.removeEventListener('click', onOk);
          cancelBtn.removeEventListener('click', onCancel);
        };

        const onOk = () => {
          cleanup();
          modal.hide();
          resolve(true);
        };

        const onCancel = () => {
          cleanup();
          modal.hide();
          resolve(false);
        };

        okBtn.addEventListener('click', onOk);
        cancelBtn.addEventListener('click', onCancel);
      });
    }

    function showResultModal(title, message) {
      return new Promise((resolve) => {
        let modalEl = document.getElementById('resultModal');
        if (!modalEl) {
          modalEl = document.createElement('div');
          modalEl.innerHTML = `
            <div class="modal fade" id="resultModal" tabindex="-1">
              <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content" style="border-radius: 18px; border:none; padding:20px 24px;">
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"
                    style="position:absolute; top:18px; right:18px;"></button>
                  <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title" id="resultModalTitle"></h5>
                  </div>
                  <div class="modal-body pt-2">
                    <p id="resultModalMessage"></p>
                  </div>
                  <div class="modal-footer border-0 d-flex justify-content-end">
                    <button type="button" class="btn btn-danger" id="resultModalOkBtn" style="background:#dc2626; border:none;">確定</button>
                  </div>
                </div>
              </div>
            </div>`;
          document.body.appendChild(modalEl);
        }

        document.getElementById('resultModalTitle').textContent = title;
        document.getElementById('resultModalMessage').textContent = message;

        const modal = new bootstrap.Modal(document.getElementById('resultModal'));
        modal.show();

        const okBtn = document.getElementById('resultModalOkBtn');
        const onOk = () => {
          okBtn.removeEventListener('click', onOk);
          modal.hide();
          resolve();
        };
        okBtn.addEventListener('click', onOk);
      });
    }

    // 新增心得送出
    document.getElementById('addForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const payload = {
        company_id: document.getElementById('company_id').value || null,
        job_id: document.getElementById('job_id').value || null,
        year: document.getElementById('year').value,
        rating: document.getElementById('rating').value,
        content: document.getElementById('content').value
      };

      const res = await fetch('/intern_experience/api/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data.success) {
        const addModalEl = document.getElementById('addModal');
        const addModalInstance = bootstrap.Modal.getInstance(addModalEl);
        document.getElementById('addForm').reset();
        addModalInstance?.hide();

        setTimeout(async () => {
          const advisorName = data.advisor_name ? data.advisor_name : '指導老師';
          await showResultModal('新增心得', `心得上傳成功！您的心得已提交給指導老師${advisorName !== '指導老師' ? '：' + advisorName : ''}。`);
          // 重新載入兩個分頁的心得（重置到第一頁）
          allExperiencesPage = 1;
          myExperiencesPage = 1;
          loadExperiences();
          loadMyExperiences();
        }, 250);
      } else {
        await showResultModal('新增心得', '上傳失敗：' + data.message);
      }
    });

    // 綁定篩選事件 - 所有心得分頁
    document.getElementById('btnSearch').addEventListener('click', function() {
      allExperiencesPage = 1;
      selectedAllExpId = null;
      loadExperiences();
    });
    document.getElementById('filterCompany').addEventListener('change', function () {
      selectedCompanyId = this.value;
      allExperiencesPage = 1;
      selectedAllExpId = null;
      loadExperiences();
    });

    // 綁定篩選事件 - 我的心得分頁
    // 綁定篩選事件 - 我的心得分頁（已移除搜尋功能）

    // 綁定分頁切換事件
    const allTab = document.getElementById('all-tab');
    const myTab = document.getElementById('my-tab');
    
    function syncExpTabActive(targetId) {
      document.querySelectorAll('.exp-tab').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-bs-target') === targetId);
      });
    }

    allTab.addEventListener('shown.bs.tab', function () {
      syncExpTabActive('#all-experiences');
      loadExperiences();
    });

    myTab.addEventListener('shown.bs.tab', function () {
      syncExpTabActive('#my-experiences');
      loadMyExperiences();
    });

    // 支援 Enter 鍵搜尋
    document.getElementById('searchKeyword').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        allExperiencesPage = 1;
        selectedAllExpId = null;
        loadExperiences();
      }
    });

    // 當新增心得 Modal 開啟時，自動填入資料
    const addModal = document.getElementById('addModal');
    if (addModal) {
      addModal.addEventListener('show.bs.modal', async function () {
        // 先載入公司列表
        await loadCompanies();
        // 然後設定表單（限制公司選擇並自動填入）
        await setupAddFormWithAdmission();
      });
      
      // 當 Modal 關閉時，重置表單
      addModal.addEventListener('hidden.bs.modal', function () {
        const form = document.getElementById('addForm');
        if (form) {
          form.reset();
        }
        // 清空唯讀欄位
        document.getElementById('company_name_display').value = '';
        document.getElementById('company_id').value = '';
        document.getElementById('job_title_display').value = '';
        document.getElementById('job_id').value = '';
        document.getElementById('year').value = '';
      });
    }

    // 初始載入（退實習生仍可瀏覽「所有心得」，僅「我的心得」隱藏上傳按鈕並顯示退實習提示）
    window.onload = async function () {
      const admissionInfo = await loadStudentAdmission();
      const btnAdd = document.getElementById('btnAddExperience');
      const withdrawnNotice = document.getElementById('withdrawnNotice');
      if (isWithdrawn && btnAdd && withdrawnNotice) {
        btnAdd.style.display = 'none';
        withdrawnNotice.style.display = 'block';
      }
      loadCompanies();
      loadExperiences();  // 所有心得：退實習生與一般學生皆可查看
    };

    // 選單開關邏輯
    document.addEventListener("DOMContentLoaded", () => {
      const menuBtn = document.getElementById("menu-btn");
      const sideMenu = document.getElementById("side-menu");
      const closeBtn = document.getElementById("close-btn");

      if (menuBtn && sideMenu && closeBtn) {
        menuBtn.addEventListener("click", () => {
          sideMenu.classList.add("open");
          sideMenu.setAttribute("aria-hidden", "false");
        });

        closeBtn.addEventListener("click", () => {
          sideMenu.classList.remove("open");
          sideMenu.setAttribute("aria-hidden", "true");
        });

        // 如果點擊 menu 以外的地方就關閉選單
        document.addEventListener("click", (e) => {
          if (
            !sideMenu.contains(e.target) &&
            !menuBtn.contains(e.target)
          ) {
            sideMenu.classList.remove("open");
            sideMenu.setAttribute("aria-hidden", "true");
          }
        });
      }
    });
  </script>
